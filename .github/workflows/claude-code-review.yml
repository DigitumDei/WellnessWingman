name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: publishing the review needs it. With read the action fetches the diff,
      # is denied when it tries to post, and still exits 0 — a green check with no review, which
      # is how this went unnoticed.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

          # Required for the review to be published, not optional polish. There are two
          # independent permission layers: the `permissions:` block above governs what the
          # GitHub token may do, while this governs what the agent may invoke. With the token
          # writable but `gh` not in the toolset, the action reviews the diff, is denied when it
          # goes to post, reports permission_denials_count 1, and still exits 0 — a green check
          # with no review.
          #
          # Deliberately no `Bash(gh api:*)`. This job holds a pull-requests:write token on
          # same-repo PRs while reading a diff it does not control, and `gh api` accepts any
          # endpoint and method — so a prompt injection in reviewed content would have an
          # unrestricted authenticated client, able to close PRs or rewrite their descriptions
          # rather than merely publish a review. These subcommands can only comment and review.
          # If the plugin turns out to need a REST endpoint for inline comments, add that one
          # endpoint rather than restoring the wildcard.
          claude_args: '--allowed-tools "Bash(gh pr comment:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

